<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Illusion of Reality</title>

    <link rel="stylesheet" href="./stylesheets/style.css" />

    <script src="./index.js" defer></script>
  </head>

  <body>
    <main>
      <section class="intro" id="intro">
        <div class="intro__sticky">
          <!-- progress -->
          <div class="scroll-progress" aria-hidden="true"></div>

          <!-- круг -->
          <img class="circle-image" src="./images/circle-image.png" alt="" />

          <!-- первая надпись -->
          <h1 class="intro__title">МЫ ЗДЕСЬ НЕ ОДНИ</h1>

            <img class="avatar avatar--2" src="./images/avatar-2.jpg" alt="" />

            <img class="avatar avatar--3" src="./images/avatar-3.jpg" alt="" />

            <img class="avatar avatar--4" src="./images/avatar-4.jpg" alt="" />
          </div>

          <!-- второй экран -->
          <div class="screen-panel">
            <div class="screen-panel__dots screen-panel__dots--left"></div>
            <div class="screen-panel__dots screen-panel__dots--right"></div>

            <div class="screen-panel__inner">
              <div class="screen-panel__side screen-panel__side--left">
                <div class="screen-person">
                  <img
                    src="./images/avatar-1.jpg"

                    alt="Леша"
                    class="screen-person__avatar"
                  />
                  <span class="screen-person__name">леша</span>
                </div>
              </div>

              <div class="screen-panel__center">
                <h2 class="screen-panel__title">МЕЖДУ НАМИ — ЭКРАН</h2>

                <p class="screen-panel__subtitle">
                  Но почему иногда кажется, что расстояния совсем нет?

              </div>

              <div class="screen-panel__side screen-panel__side--right">
